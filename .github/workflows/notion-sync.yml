# PR이 develop/main에 머지되면 노션 데이터베이스에 자동 기록
# 위치: 각 레포의 .github/workflows/notion-sync.yml
#
# 사전 준비 (레포 Settings → Secrets and variables → Actions):
#   NOTION_TOKEN        노션 integration 토큰 (ntn_...)
#   NOTION_DATABASE_ID  기록할 노션 데이터베이스 ID
#
# 노션 데이터베이스에 필요한 속성(컬럼):
#   제목(title) · 레포(select) · 작성자(text) · 브랜치(text) · PR 링크(url) · 머지일(date)

name: Notion 변경사항 문서화

on:
  pull_request:
    types: [closed]
    branches: [develop, main]
  # Actions 탭에서 수동 실행 가능 (노션 연동 테스트용)
  workflow_dispatch:

jobs:
  notion-sync:
    # 머지된 PR만 (그냥 닫힌 PR은 제외). 수동 실행은 항상 허용
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: 노션 데이터베이스에 기록
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          PR_TITLE: ${{ github.event.pull_request.title || '수동 테스트 실행' }}
          PR_URL: ${{ github.event.pull_request.html_url || 'https://github.com/Ureca-SteamIron' }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login || github.actor }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref || 'manual-test' }}
          PR_BODY: ${{ github.event.pull_request.body }}
          REPO: ${{ github.event.repository.name }}
          MERGED_AT: ${{ github.event.pull_request.merged_at }}
        run: |
          # 수동 실행이면 머지 시각 대신 현재 시각 사용
          export MERGED_AT="${MERGED_AT:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}"

          jq -n '{
            parent: { database_id: env.NOTION_DATABASE_ID },
            properties: {
              "제목":    { title: [{ text: { content: env.PR_TITLE } }] },
              "레포":    { select: { name: env.REPO } },
              "작성자":  { rich_text: [{ text: { content: env.PR_AUTHOR } }] },
              "브랜치":  { rich_text: [{ text: { content: env.PR_BRANCH } }] },
              "PR 링크": { url: env.PR_URL },
              "머지일":  { date: { start: env.MERGED_AT } }
            },
            children: [
              { object: "block",
                paragraph: { rich_text: [{ text: { content: ((env.PR_BODY // "") | .[0:1900]) } }] } }
            ]
          }' > payload.json

          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" \
            -X POST "https://api.notion.com/v1/pages" \
            -H "Authorization: Bearer $NOTION_TOKEN" \
            -H "Notion-Version: 2022-06-28" \
            -H "Content-Type: application/json" \
            --data @payload.json)

          echo "== Notion API 응답: HTTP $HTTP_STATUS =="
          cat response.json | jq '.' || cat response.json

          if [ "$HTTP_STATUS" -ge 400 ]; then
            echo "::error::노션 기록 실패 (HTTP $HTTP_STATUS) — 위 응답의 message 확인"
            exit 1
          fi
