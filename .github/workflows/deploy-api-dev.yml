name: Backend Dev Deploy (All Modules)

# 1. 동작 조건: develop 브랜치에 push(merge) 될 때 작동
on:
  push:
    branches: [ "develop" ]
    # 백엔드 관련 모든 코드가 변경될 때 실행되도록 batch 경로 추가
    paths:
      - 'app-api-server/**'
      - 'app-batch-server/**'
      - 'module-domain-rdb/**'
      - 'build.gradle'
      - 'settings.gradle'

jobs:
  build-and-deploy:
    # m40327 등 팀원 PC에 설치된 self-hosted 윈도우 러너에서 실행
    runs-on: [ self-hosted, Windows ]

    steps:
      - name: 1. 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 2. Java 21 환경 설정 (프로젝트 toolchain이 21이라 17로 실행하면 UnsupportedClassVersionError로 즉사)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: 3. 패키지 빌드 (API & Batch Server 동시 빌드)
        shell: powershell
        run: |
          # 두 모듈을 동시에 빌드하도록 명령어 수정
          .\gradlew :app-api-server:bootJar :app-batch-server:bootJar -x test

      - name: 4. 기존 서버 종료 및 새 배포 파일 복사, 실행
        shell: powershell
        env:
          # 중요: GitHub Actions가 종료될 때 백그라운드 프로세스(Spring)를 같이 죽이는 것을 방지
          RUNNER_TRACKING_ID: "" 
        run: |
          $dest = "C:/Users/student/Desktop/SteamIron/servers"
          # 8080은 nginx(my-react) 컨테이너가 FE 정적 파일을 서빙하는 데 쓰고 있어 충돌 → BE는 8090 사용
          $apiPort = 8090
          $batchPort = 8081
          
          # 1. 배포 폴더 생성 (없으면 만들기)
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          
          # 2. 기존 실행 중인 Spring Boot 서버 종료 (8080, 8081 포트 동시 확인)
          Write-Host "➡️ 포트 ${apiPort}(API)와 ${batchPort}(Batch) 프로세스 확인 중..."
          
          $apiProcess = Get-NetTCPConnection -LocalPort $apiPort -ErrorAction SilentlyContinue
          if ($apiProcess) {
              Write-Host "➡️ API 서버 프로세스(PID: $($apiProcess.OwningProcess)) 강제 종료"
              Stop-Process -Id $apiProcess.OwningProcess -Force -ErrorAction SilentlyContinue
          }
          
          $batchProcess = Get-NetTCPConnection -LocalPort $batchPort -ErrorAction SilentlyContinue
          if ($batchProcess) {
              Write-Host "➡️ Batch 서버 프로세스(PID: $($batchProcess.OwningProcess)) 강제 종료"
              Stop-Process -Id $batchProcess.OwningProcess -Force -ErrorAction SilentlyContinue
          }
          
          # 서버가 완전히 꺼질 때까지 대기
          Start-Sleep -Seconds 3 
          
          # 3. 새로운 JAR 파일 복사 및 이름 변경
          Write-Host "➡️ 새로운 빌드 파일 복사 중..."
          Copy-Item -Path "app-api-server/build/libs/*-SNAPSHOT.jar" -Destination "$dest/api-server.jar" -Force
          Copy-Item -Path "app-batch-server/build/libs/*-SNAPSHOT.jar" -Destination "$dest/batch-server.jar" -Force
          
          # 4. 백그라운드에서 Spring Boot 실행
          Write-Host "➡️ 새로운 API 서버 백그라운드 실행..."
          Start-Process -FilePath "java" -ArgumentList "-jar", "$dest/api-server.jar", "--server.port=$apiPort" -WorkingDirectory $dest -RedirectStandardOutput "$dest/api_output.log" -RedirectStandardError "$dest/api_error.log" -WindowStyle Hidden
          
          Write-Host "➡️ 새로운 Batch 서버 백그라운드 실행..."
          Start-Process -FilePath "java" -ArgumentList "-jar", "$dest/batch-server.jar" -WorkingDirectory $dest -RedirectStandardOutput "$dest/batch_output.log" -RedirectStandardError "$dest/batch_error.log" -WindowStyle Hidden
          
          Write-Host "✅ 배포 완료 -> $dest 폴더에서 api_output.log, batch_output.log 를 확인하세요!"
