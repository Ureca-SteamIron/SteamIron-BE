# ⚠️ 이 파일은 "템플릿"입니다. (실제 값 없음, git에 커밋됨)
# 사용법:
#   1) 이 파일을 같은 폴더에 application.yaml 로 복사
#   2) 아래 password 를 팀 채널에서 공유받은 실제 DB 비밀번호로 채우기
#   3) application.yaml 은 gitignore 되어 커밋되지 않음
spring:
  application:
    name: app-api-server
  datasource:
    url: jdbc:postgresql://100.96.97.2:5432/mydb   # 팀 DB (Tailscale 연결 필요)
    username: myuser
    password: ""            # 🔑 팀 채널에서 받은 DB 비밀번호를 여기 입력
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update

  management:
    endpoints:
      web:
        exposure:
          include: health, info, metrics

  logging:
    file:
      name: /app/logs/app.log

  springdoc:
    swagger-ui:
      path: /swagger-ui.html
      operationsSorter: method
      tags-sorter: alpha
      display-request-duration: true
    api-docs:
      path: /v3/api-docs
    default-consumes-media-type: application/json
    default-produces-media-type: application/json

# 에러 응답 JSON에 message 필드 포함 (예: "만료된 refresh token입니다...")
server:
  error:
    include-message: always

# Discord OAuth2 설정 (시크릿은 환경변수로 주입)
discord:
  client-id: ${DISCORD_CLIENT_ID:}
  client-secret: ${DISCORD_CLIENT_SECRET:}
  redirect-uri: ${DISCORD_REDIRECT_URI:http://localhost:5173/auth/callback}

jwt:
  # HS256 서명 키. 32글자 이상 필수. 배포 환경에서는 반드시 환경변수로 교체할 것
  secret: ${JWT_SECRET:steamiron-local-dev-secret-key-change-me-in-production}
  access-token-expiration: 1800000      # 30분 (ms)
  refresh-token-expiration: 1209600000  # 14일 (ms)
