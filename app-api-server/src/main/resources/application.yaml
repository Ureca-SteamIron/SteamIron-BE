spring:
  application:
    name: app-api-server
  datasource:
    url: jdbc:postgresql://100.96.97.2:5432/mydb
    username: myuser
    password: mypassword
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update

  management:
    endpoints:
      web:
        exposure:
          include: health, info, metrics

  logging:
    file:
      name: /app/logs/app.log

  springdoc:
    swagger-ui:
      path: /swagger-ui.html
      operationsSorter: method
      tags-sorter: alpha
      display-request-duration: true
    api-docs:
      path: /v3/api-docs
    default-consumes-media-type: application/json
    default-produces-media-type: application/json

# 에러 응답 JSON에 message 필드 포함 (예: "만료된 refresh token입니다...")
server:
  error:
    include-message: always

# Discord OAuth2 설정 (시크릿은 환경변수로 주입, git에 올리지 않는다)
discord:
  client-id: ${DISCORD_CLIENT_ID:}
  client-secret: ${DISCORD_CLIENT_SECRET:}
  redirect-uri: ${DISCORD_REDIRECT_URI:http://localhost:5173/auth/callback}

jwt:
  # HS256 서명 키. 32글자 이상 필수. 배포 환경에서는 반드시 환경변수로 교체할 것
  secret: ${JWT_SECRET:steamiron-local-dev-secret-key-change-me-in-production}
  access-token-expiration: 1800000      # 30분 (ms)
  refresh-token-expiration: 1209600000  # 14일 (ms)

